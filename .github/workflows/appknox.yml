name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Arrange project folders
        run: |
          mkdir -p app/src/main/java/com/motionstudio/app app/src/main/assets
          mv -f MainActivity.kt app/src/main/java/com/motionstudio/app/ 2>/dev/null || true
          mv -f AndroidManifest.xml app/src/main/ 2>/dev/null || true
          mv -f index.html app/src/main/assets/ 2>/dev/null || true
          
          # ১. রুট build.gradle.kts ফাইল তৈরি
          cat > build.gradle.kts <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath("com.android.tools.build:gradle:8.2.2")
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20")
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # ২. settings.gradle.kts ফাইল তৈরি
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MotionV.0.1"
          include(":app")
          EOF

          # ৩. app/build.gradle.kts ফাইল তৈরি
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.motionstudio.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.motionstudio.app"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.webkit:webkit:1.11.0")
              implementation("androidx.activity:activity-ktx:1.9.0")
          }
          EOF
          
          echo "--- project files checked ---"
          find . -maxdepth 3 -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon -x test

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionStudio-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Motion Studio build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
