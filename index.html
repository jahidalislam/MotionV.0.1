<script>
/* Android WebView: blob downloads (export) -> native save via AndroidBridge */
(function(){
 if(!window.AndroidBridge)return;
 document.addEventListener('click',function(e){
  var a=e.target&&e.target.closest&&e.target.closest('a[download][href^="blob:"]');
  if(!a)return;
  e.preventDefault();e.stopPropagation();
  fetch(a.href).then(function(r){return r.blob()}).then(function(b){
   var fr=new FileReader();
   fr.onload=function(){var s=fr.result;AndroidBridge.saveFile(a.download,b.type||'application/octet-stream',s.substring(s.indexOf(',')+1))};
   fr.readAsDataURL(b);
  });
 },true);
})();

 case'cfx':h.push(tilesB('cfx',CFX_L,(c&&c.fx)||'none'));break;
 case'trans':{const i=sel.k=='s'?sel.i:Math.max(0,sceneAt(T));if(i<1){h.push('<div class="empty2">প্রথম সিনের আগে ট্রানজিশন নেই — দ্বিতীয় বা পরের সিন সিলেক্ট করুন</div>');break}const tr=S[i].tr||{t:'none',d:.5};h.push(`<div class="hint">সিন ${i} → ${i+1} এর মাঝে</div>`,tilesB('trn',TR_L,tr.t),sl2('tr','d','সময় (সে.)',.2,2,.1,tr.d));break}

 case'adj':h.push(sl2('g','b','ব্রাইটনেস',50,150,1,ADJ.b),sl2('g','c','কনট্রাস্ট',50,150,1,ADJ.c),sl2('g','s','স্যাচুরেশন',0,200,1,ADJ.s),`<div class="chips"><button data-a="arst">↺ রিসেট</button></div>`);break;

  if(stab==0){if(tmp)h.push(`<div class="foot2">${bt('fxadd','＋ সিনে যোগ','pri'.length&&0)}${bt('fxrep','↻ বদলান')}${bt('fxcancel','✕')}</div>`.replace('<button data-a="fxadd">','<button class="pri" data-a="fxadd">'));h.push(fxUI())}

function skGrid(){const q=skq.trim().toLowerCase();
